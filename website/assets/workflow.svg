<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title description">
  <title id="title">Workflow for updating the federated learning survey</title>
  <desc id="description">Edit a concept, add a Markdown concept, or create and register a dimension. Preview locally, check navigation, commit and push to main. GitHub Actions builds and publishes. More than five concepts automatically enables arrows.</desc>
  <rect width="1080" height="640" rx="18" fill="#f5f5f3" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7388a7" />
    </marker>
  </defs>
  <text x="540" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#263c59">UPDATE THE FL SURVEY</text>
  <text x="540" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#68717e">Markdown content → preview → publish</text>
  <rect x="30" y="105" width="310" height="105" rx="10" fill="#ffffff" stroke="#d1d9e3" />
  <text x="185.0" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">Update a concept</text>
  <text x="185.0" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">Edit its existing Markdown file.</text>
  <rect x="385" y="105" width="310" height="105" rx="10" fill="#ffffff" stroke="#d1d9e3" />
  <text x="540.0" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">Add a concept</text>
  <text x="540.0" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">Add a .md file or README</text>
  <text x="540.0" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">inside the dimension folder.</text>
  <rect x="740" y="105" width="310" height="105" rx="10" fill="#ffffff" stroke="#d1d9e3" />
  <text x="895.0" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">Add a dimension</text>
  <text x="895.0" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">Create its folder and index.md;</text>
  <text x="895.0" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">register it in docs/index.md.</text>
  <path d="M185 210 V240 H540 V261" fill="none" stroke="#7388a7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M540 210 V261" fill="none" stroke="#7388a7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M895 210 V240 H540" fill="none" stroke="#7388a7" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="315" y="270" width="450" height="78" rx="10" fill="#ffffff" stroke="#d1d9e3" />
  <text x="540.0" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">Preview locally</text>
  <text x="540.0" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">Check text, cylinder navigation, and links.</text>
  <path d="M540 348 V374" fill="none" stroke="#7388a7" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="315" y="382" width="450" height="78" rx="10" fill="#e8eef8" stroke="#9fb3d0" />
  <text x="540.0" y="411" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">Commit and push to main</text>
  <text x="540.0" y="439" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">GitHub Actions builds and publishes.</text>
  <path d="M540 460 V486" fill="none" stroke="#7388a7" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="225" y="494" width="630" height="88" rx="10" fill="#e8eef8" stroke="#9fb3d0" />
  <text x="540.0" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#263c59">The live website updates</text>
  <text x="540.0" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">Concept names and listings are generated automatically.</text>
  <text x="540.0" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596a80">More than five concepts → arrows enable automatically.</text>
  <text x="540" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#68717e">Project paths above are relative to website/.</text>
</svg>
